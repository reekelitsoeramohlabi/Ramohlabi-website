        <div class="container my-5">
            <h1 class="Registration">Tourism Registration</h1>
            <form id="registration" class="mx-auto" style="max-width:600px;">
                <div class="mb-3">
                    <label for="fullname" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="fullname" required=minlegth="2">
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <div class="mb-3">
                    <label for="phone" class="form-label">Phone Number</label>
                    <input type="tel" class="form-control" id="phone" pattern="[0-9+() -]{8,20}" required>
                </div>
                <div class="mb-3">
                    <label for="gender" class="form-label">Gender</label>
                    <select type="gender" class="form-select" required>
                        <option value="">Select an option</option>
                        <option value="female">Female</option>
                        <option value="male">Male</option>
                        <option value="other">Other</option>
                        <option value="prefer-not-to-say">Prefer not to say</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" minlength="8" required>
                    <small>Use at least 8 characters.</small>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">
                    Confirm Password
                    </label>
                    <input type="password" class="form-control" id="confirmPassword" required>
                </div>
                <div id="formMessage" class="mb-3" role="status" arial-live="polite"></div>
                <button type="submit" class="btn btn-success">
                    Register
                </button>
                <button type="reset" class="btn btn-secondary">
                    Reset
                </button>
            </form>
        </div>
        <script src="script.js"></script>
    </body>
</html>
