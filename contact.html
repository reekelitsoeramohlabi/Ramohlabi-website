        <main>
            <section>
                <h2>Get in Touch</h2>
                <p>Email: reekelitsoeramohlabi3@gmail.com</p>
                <p>Location: Thaba tseka Lesotho</p>
            </section>

            <section>
                <h2>Tourism Enquiry and Booking Form</h2>
                <form action="#" method="Post">
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name" required>
                    <br><br>

                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required>
                    <br><br>

                    <label for="date">Preferred Travel Date:</label>
                    <input type="date" id="date" name="date" required>
                    <br><br>

                    <label for="phone">Phone Number</label>
                    <input for="tel" id="phone" name="phone" required>
                    <br><br>

                    <label for="destination">Choose Distination</label>
                    <select id="destination" name="destination">
                        <option value="">Select a destination</option>
                        <option value="Maletsunyane Falls">Maletsunyane Falls</option>
                        <option value="Katse Dam">Katse Dam</option>
                        <option value="Sehlabathebe National Park">Sehlabathebe National Park</option>
                        <option value="Ts'ehlanyane National Park">Ts'ehlanyane National Park</option>
                    </select>
                    <br><br>

                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5"></textarea>
                    <br><br>

                    <label for="guests">Number Of Guests</label>
                    <input type="number" id="guests" name="guests" min="2" max="15" reguired>
                    <br><br>

                    <button type="submit">Submit Enquiry</button>
                    <button type="reset">Clear Form</button>
                </form>
            </section>
        </main>
